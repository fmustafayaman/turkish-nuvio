name: Provider Health Check

on:
  schedule:
    # Her gün 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: provider-health etiketini garanti et
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create provider-health --color d73a4a --description "Otomatik provider domain/test health check bulguları" --force

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # --fix: sadece domain rotasyonunu (301/302 ile yeni domain'e taşınma)
      # otomatik düzeltir — src/<id>/constants.js'teki DOMAIN_CANDIDATES
      # sırasını canlı domain başa gelecek şekilde yazar. Site yapısı
      # (HTML/API) değiştiyse bunu düzeltemez, aşağıdaki test adımları
      # başarısız kalır ve issue açılır.
      - name: Domain sağlık kontrolü (+ otomatik düzeltme)
        id: domains
        continue-on-error: true
        run: npm run check:domains -- --fix 2>&1 | tee domains.log

      - name: Domain düzeltmesi var mı?
        id: fix_diff
        run: |
          if git diff --quiet -- src/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle'ları yeniden derle (düzeltme varsa)
        if: steps.fix_diff.outputs.changed == 'true'
        run: npm run build

      - name: Animecix testi
        id: test_animecix
        continue-on-error: true
        run: npm test 2>&1 | tee test-animecix.log

      - name: FullHDFilm testi
        id: test_fullhdfilm
        continue-on-error: true
        run: npm run test:fullhdfilm 2>&1 | tee test-fullhdfilm.log

      - name: Dizifilm testi
        id: test_dizifilm
        continue-on-error: true
        run: npm run test:dizifilm 2>&1 | tee test-dizifilm.log

      # Sözleşme (CLAUDE.md) doğrulaması: yukarıdaki testler "en az 1 stream
      # var mı" bakar, bu ise dönen stream objelerinin gerçek şeklini
      # (url/type/quality/headers/provider) doğrular.
      - name: Stream şeması kontrolü
        id: schema
        continue-on-error: true
        run: npm run check:schema 2>&1 | tee schema.log

      # Domain otomatik düzeltildiyse VE tüm testler hâlâ geçiyorsa
      # (yani sadece domain değişmiş, scraping mantığı bozulmamış):
      # otomatik bir PR aç. Testlerden biri patlarsa PR açılmaz — o
      # durumda site yapısı da değişmiş demektir, insan/LLM bakması gerekir.
      - name: Otomatik domain-fix PR'ı aç
        id: auto_pr
        if: >
          steps.fix_diff.outputs.changed == 'true' &&
          steps.test_animecix.outcome != 'failure' &&
          steps.test_fullhdfilm.outcome != 'failure' &&
          steps.test_dizifilm.outcome != 'failure' &&
          steps.schema.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="auto/domain-fix-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/ providers/
          git commit -m "fix: domain rotasyonunu otomatik güncelle" -m "Provider Health Check workflow'u tarafından otomatik oluşturuldu. check-domains.js --fix, DOMAIN_CANDIDATES içindeki olu/redirect eden domain'i guncel olanla degistirdi; build sonrasi tum test harness'lari gecti."
          git push origin "$branch"
          {
            echo "Bu PR, Provider Health Check workflow'u (\`.github/workflows/health-check.yml\`) tarafından otomatik açıldı."
            echo ""
            echo "check-domains.js --fix, bir veya daha fazla provider'ın DOMAIN_CANDIDATES listesindeki artık redirect eden domain'i güncel domain ile değiştirdi. Fix sonrası tüm test harness'ları (animecix, fullhdfilm, dizifilm) geçti, yani sadece domain değişmiş; scraping mantığı hâlâ çalışıyor."
            echo ""
            echo "Değişiklik detayı için şu run'a bakın: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "Gözden geçirip merge edebilirsiniz."
          } > /tmp/pr_body.md
          gh pr create \
            --title "fix: otomatik domain rotasyonu düzeltmesi" \
            --body-file /tmp/pr_body.md \
            --label "provider-health" || echo "pr_failed=true" >> "$GITHUB_OUTPUT"

      - name: Sonuçları raporla
        uses: actions/github-script@v7
        env:
          DOMAINS_OUTCOME: ${{ steps.domains.outcome }}
          ANIMECIX_OUTCOME: ${{ steps.test_animecix.outcome }}
          FULLHDFILM_OUTCOME: ${{ steps.test_fullhdfilm.outcome }}
          DIZIFILM_OUTCOME: ${{ steps.test_dizifilm.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          FIX_CHANGED: ${{ steps.fix_diff.outputs.changed }}
          AUTO_PR_OUTCOME: ${{ steps.auto_pr.outcome }}
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'provider-health';
            const TITLE = '🔴 Provider health check başarısız';

            const checks = [
              { name: 'Domain sağlık kontrolü', outcome: process.env.DOMAINS_OUTCOME, log: 'domains.log' },
              { name: 'Animecix testi', outcome: process.env.ANIMECIX_OUTCOME, log: 'test-animecix.log' },
              { name: 'FullHDFilm testi', outcome: process.env.FULLHDFILM_OUTCOME, log: 'test-fullhdfilm.log' },
              { name: 'Dizifilm testi', outcome: process.env.DIZIFILM_OUTCOME, log: 'test-dizifilm.log' },
              { name: 'Stream şeması kontrolü', outcome: process.env.SCHEMA_OUTCOME, log: 'schema.log' },
            ];

            const failed = checks.filter(c => c.outcome === 'failure');
            const fixAttempted = process.env.FIX_CHANGED === 'true';
            const autoFixOpened = fixAttempted && process.env.AUTO_PR_OUTCOME === 'success';
            const fixAttemptedButStillFailing = fixAttempted && !autoFixOpened;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: LABEL,
                color: 'd73a4a',
                description: 'Otomatik provider domain/test health check bulguları',
              });
            } catch (e) {
              // muhtemelen zaten var, yoksay
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });
            const existing = openIssues[0];

            if (failed.length === 0) {
              console.log('Tüm kontroller geçti.');
              if (existing) {
                const note = autoFixOpened
                  ? ` (domain rotasyonu otomatik düzeltildi, bkz. açılan PR)`
                  : '';
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `✅ Bu run'da tüm kontroller geçti${note} (run: ${context.runId}). Issue kapatılıyor.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `Provider health check bazı kontrollerde başarısız oldu.`,
              ``,
              `**Çalıştırma:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              fixAttemptedButStillFailing ? `\nNot: Domain rotasyonu otomatik düzeltilmeye çalışıldı ama testler hâlâ başarısız — otomatik PR açılmadı, aşağıdaki hatalar muhtemelen site yapısı (HTML/API) değişikliğinden kaynaklanıyor ve elle/LLM ile bakılması gerekiyor.` : '',
              ``,
              ...failed.map(c => {
                let log = '';
                try { log = fs.readFileSync(c.log, 'utf8'); } catch { log = '(log okunamadı)'; }
                const tail = log.split('\n').slice(-40).join('\n');
                return `### ❌ ${c.name}\n\n\`\`\`\n${tail}\n\`\`\`\n`;
              }),
              `---`,
              `Muhtemel neden: site domain'i değişmiş olabilir (\`src/<id>/constants.js\` içindeki \`DOMAIN_CANDIDATES\`'ı güncelleyin) veya sitenin HTML/API yapısı değişmiş olabilir.`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: [LABEL],
              });
            }
